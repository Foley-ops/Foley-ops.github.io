<ul class="link-list{% if include.class %} {{ include.class }}{% endif %}">
  {%- for l in site.data.links %}
  {%- if include.skip and l.icon == include.skip %}{% continue %}{% endif %}
  <li>
    <a href="{{ l.url }}"{% unless l.icon == "email" %} rel="me noopener" target="_blank"{% endunless %}>
      {%- include icon.html name=l.icon -%}
      <span class="ll-label">{{ l.label }}</span>
      {%- if include.detailed %}<span class="ll-display">{{ l.display }}</span>{% endif -%}
    </a>
  </li>
  {%- endfor %}
</ul>
