---
layout: default
---
<header class="page-header">
  {%- if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
  <h1 class="page-title">{{ page.title }}</h1>
  {%- if page.lede %}<p class="page-lede">{{ page.lede | markdownify | remove: '<p>' | remove: '</p>' | strip }}</p>{% endif %}
</header>
<div class="page-body">
{{ content }}
</div>
