# Projects — grouped by `group` (groups appear in the order listed here).
#   featured: true → also shown on the home page
#   tags: short tech/topic labels
#   links: any of code, paper, demo, docs

groups:
  - key: research
    title: Research software
  - key: tools
    title: Tools & side projects

items:
  - name: ParetoPipe
    group: research
    featured: true
    note: with the CloudSys Lab, UTSA
    blurb: >-
      Open-source framework for multi-objective DNN partitioning. Sweeps every
      valid split point across Raspberry Pi and edge-to-GPU-server testbeds,
      simulates network conditions, and maps the latency–throughput Pareto front.
      Supports PyTorch RPC and raw TCP backends.
    tags: [PyTorch, pipeline parallelism, edge inference]
    links:
      code: https://github.com/cloudsyslab/ParetoPipe
      paper: https://arxiv.org/abs/2601.08025

  - name: distributed-inference
    group: research
    featured: true
    blurb: >-
      Pipelined CNN inference across a Raspberry Pi cluster using balanced model
      partitions and asynchronous RPC with multiple batches in flight:
      13.85 images/s, 6.38× a sequential baseline.
    tags: [PyTorch, RPC, Raspberry Pi]
    links:
      code: https://github.com/Foley-ops/distributed-inference

  - name: knowledge-navigator
    group: research
    featured: true
    blurb: >-
      Local-first knowledge-graph wiki of math and AI concepts with
      retrieval-augmented Q&A: a local LLM answers from up to 8 retrieved pages
      with citable IDs, and answers with invalid citations are discarded. An
      evaluation harness picks the answering model from 8B–12B open-weight
      candidates; search and path-finding stay deterministic.
    tags: [TypeScript, Docusaurus, SQLite FTS5, Ollama]
    links:
      code: https://github.com/Foley-ops/knowledge-navigator

  - name: Trading-card recognition
    group: tools
    blurb: >-
      Local Magic: The Gathering card identifier: detect, warp, embed with
      DINOv3, and FAISS nearest-neighbor search, replacing a perceptual-hash
      baseline that didn't scale. On a 5,327-card catalog with 2,060 distorted
      queries it reaches Recall@1 0.82 and Recall@5 1.00; ViT beats ConvNeXt on
      shared-frame cards because average pooling washes out the art.
    tags: [DINOv3, FAISS, retrieval, computer vision]

  - name: firmament
    group: tools
    blurb: >-
      A hands-off world simulator: real physics, exact conservation laws,
      bit-identical replay, and a single seeded life form. Built in
      acceptance-tested phases.
    tags: [Python, simulation, GPU]
    links:
      code: https://github.com/Foley-ops/firmament

  - name: mtg-deck-builder
    group: tools
    blurb: >-
      Builds Magic: The Gathering Commander decks across five power brackets by
      combining real play data (EDHREC, Commander Spellbook, Scryfall) with a
      graph neural network trained on card co-occurrence, under budget and
      collection constraints.
    tags: [PyTorch Geometric, GNNs, recommender]
    links:
      code: https://github.com/Foley-ops/mtg-deck-builder

  - name: coding-playground-for-kids
    group: tools
    blurb: >-
      Self-hosted platform that teaches kids to program through 61 guided Python
      and JavaScript challenges. Code runs in the browser via Pyodide, so it
      works offline on a home network.
    tags: [Flask, Pyodide, CodeMirror, Docker]
    links:
      code: https://github.com/Foley-ops/coding-playground-for-kids

  - name: cutoffarr
    group: tools
    blurb: >-
      Go service that unmonitors movies and seasons in Radarr/Sonarr once they
      meet their quality profile, with a dry-run dashboard, webhook
      integration, and guardrails against destructive writes.
    tags: [Go, Docker, self-hosting]
    links:
      code: https://github.com/Foley-ops/cutoffarr
